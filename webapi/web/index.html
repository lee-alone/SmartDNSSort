<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">SmartDNSSort Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Local Fonts -->
    <link rel="stylesheet" href="fonts/fonts.css">

    <!-- Local Built Tailwind CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- IP Pool Monitor Enhancements -->
    <link rel="stylesheet" href="css/ip-pool-enhancements.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-display antialiased transition-colors duration-200">

    <div class="flex h-screen w-full overflow-hidden">
        <!-- SideNavBar -->
        <div id="sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col h-full overflow-hidden relative">
            <!-- Header -->
            <div id="header-container"></div>

            <!-- Main Content Views -->
            <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
                <!-- 初始化设置界面 -->
                <div id="view-setup" class="view-content fixed inset-0 z-[100] bg-white dark:bg-gray-900 flex items-center justify-center" style="display: none;">
                    <!-- 等待重启蒙层 -->
                    <div id="setup-restart-overlay" class="fixed inset-0 z-[110] bg-black bg-opacity-60 flex items-center justify-center" style="display: none;">
                        <div class="bg-white dark:bg-gray-800 rounded-xl p-8 text-center shadow-2xl max-w-sm mx-4">
                            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
                            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2" data-i18n="setup.restarting">服务重启中...</h3>
                            <p class="text-gray-600 dark:text-gray-400 text-sm" data-i18n="setup.restartingDesc">请等待 3 秒后自动跳转到新端口</p>
                            <p class="text-gray-500 dark:text-gray-500 text-xs mt-2" id="setup-countdown">3</p>
                        </div>
                    </div>
                    
                    <div class="w-full max-w-md p-8 space-y-6 bg-white dark:bg-gray-800 rounded-xl shadow-2xl">
                        <div class="text-center">
                            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2" data-i18n="setup.title">SmartDNSSort 初始设置</h1>
                            <p class="text-gray-600 dark:text-gray-400" data-i18n="setup.subtitle">请配置管理员账户和 Web 服务端口</p>
                        </div>
                        
                        <form id="setup-form" class="space-y-4">
                            <div>
                                <label for="setup-username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="setup.username">用户名</label>
                                <input 
                                    type="text" 
                                    id="setup-username" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="admin"
                                    required
                                    minlength="3"
                                    maxlength="32"
                                />
                            </div>
                            
                            <div>
                                <label for="setup-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="setup.password">密码</label>
                                <input 
                                    type="password" 
                                    id="setup-password" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="至少6位字符"
                                    required
                                    minlength="6"
                                />
                            </div>
                            
                            <div>
                                <label for="setup-confirm-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="setup.confirmPassword">确认密码</label>
                                <input 
                                    type="password" 
                                    id="setup-confirm-password" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="再次输入密码"
                                    required
                                    minlength="6"
                                />
                            </div>
                            
                            <div>
                                <label for="setup-port" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="setup.port">Web 服务端口</label>
                                <input 
                                    type="number" 
                                    id="setup-port" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="8080"
                                    required
                                    min="1024"
                                    max="65535"
                                />
                            </div>
                            
                            <div id="setup-error" class="text-red-600 dark:text-red-400 text-sm hidden"></div>
                            
                            <button 
                                type="submit" 
                                id="setup-submit-btn"
                                class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                                data-i18n="setup.submit"
                            >
                                完成设置
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- 登录界面 -->
                <div id="view-login" class="view-content fixed inset-0 z-[100] bg-white dark:bg-gray-900 flex items-center justify-center" style="display: none;">
                    <div class="w-full max-w-md p-8 space-y-6 bg-white dark:bg-gray-800 rounded-xl shadow-2xl">
                        <div class="text-center">
                            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2" data-i18n="login.title">SmartDNSSort 登录</h1>
                            <p class="text-gray-600 dark:text-gray-400" data-i18n="login.subtitle">请输入管理员凭据</p>
                        </div>
                        
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label for="login-username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="login.username">用户名</label>
                                <input 
                                    type="text" 
                                    id="login-username" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="admin"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="login.password">密码</label>
                                <input 
                                    type="password" 
                                    id="login-password" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="密码"
                                    required
                                />
                            </div>
                            
                            <div id="login-error" class="text-red-600 dark:text-red-400 text-sm hidden"></div>
                            
                            <button 
                                type="submit" 
                                id="login-submit-btn"
                                class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                                data-i18n="login.submit"
                            >
                                登录
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Dashboard View -->
                <div id="view-dashboard" class="view-content" style="display: none;"></div>

                <!-- Configuration View -->
                <div id="view-config" class="view-content" style="display: none;"></div>

                <!-- Custom Rules View -->
                <div id="view-rules" class="view-content" style="display: none;"></div>

                <!-- Footer -->
                <div id="footer-container"></div>
            </main>
        </div>
    </div>

    <!-- i18n 模块（必须首先加载） -->
    <script src="js/i18n/resources-en.js"></script>
    <script src="js/i18n/resources-zh-cn.js"></script>
    <script src="js/i18n/core.js"></script>
    <script src="js/i18n/init.js"></script>

    <!-- Component Loader（必须在其他模块之前加载） -->
    <script src="js/modules/component-loader.js"></script>
    
    <!-- API 配置（必须在其他模块之前加载） -->
    <script src="js/modules/api-config.js"></script>
   
    <!-- CSRF 保护模块 -->
    <script src="js/modules/csrf.js"></script>
   
    <!-- 虚拟列表模块 -->
    <script src="js/modules/virtual-list.js"></script>
   
    <!-- 服务监控模块 -->
    <script src="js/modules/service-monitor.js"></script>
   
    <!-- 可访问性增强模块 -->
    <script src="js/modules/accessibility.js"></script>
   
    <!-- 配置搜索模块 -->
    <script src="js/modules/config-search.js"></script>
   
    <!-- app 模块 -->
    <script src="js/modules/utils.js"></script>
    <script src="js/modules/navigation.js"></script>
    <!-- Recursor 模块必须在 config.js 之前加载 -->
    <script src="js/modules/recursor.js"></script>
    <script src="js/modules/recursor-installer.js"></script>
    <script src="js/modules/config.js"></script>
    <script src="js/modules/config-sidebar.js"></script>
    <script src="js/modules/charts.js"></script>
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/ip-pool.js"></script>
    <script src="js/modules/adblock.js"></script>
    <script src="js/modules/custom-settings.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
